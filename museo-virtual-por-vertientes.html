<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Los pioneros de la psicología precientífica | Museo Virtual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #f2f3f5;
    --wall-2: #e6e8ec;
    --panel: #ffffff;
    --ink: #1a2132;
    --ink-soft: #4a5468;
    --line: #c9cdd6;
    --lapis: #2d4a94;
    --lapis-soft: #dfe6f6;
    --brass: #8a6a24;
    --frame-a: #8a6a24;
    --frame-b: #d9b863;
    --mat: #f7f4ec;
    --shadow: 0 18px 40px -22px rgba(20, 30, 60, .45);
    --font-display: "Cormorant Garamond", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wall: #12161d;
      --wall-2: #1a2029;
      --panel: #1d2430;
      --ink: #ece8df;
      --ink-soft: #aeb4c2;
      --line: #313a49;
      --lapis: #8fa9ec;
      --lapis-soft: #232d46;
      --brass: #d1ad5c;
      --frame-a: #7a5d22;
      --frame-b: #d8b768;
      --mat: #e9e4d6;
      --shadow: 0 18px 40px -22px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --wall: #12161d;
    --wall-2: #1a2029;
    --panel: #1d2430;
    --ink: #ece8df;
    --ink-soft: #aeb4c2;
    --line: #313a49;
    --lapis: #8fa9ec;
    --lapis-soft: #232d46;
    --brass: #d1ad5c;
    --frame-a: #7a5d22;
    --frame-b: #d8b768;
    --mat: #e9e4d6;
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, .8);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 70px); }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 1.0625rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--lapis); outline-offset: 3px; border-radius: 4px; }

  /* ---------- Barra superior ---------- */
  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px clamp(14px, 3vw, 32px);
    background: var(--wall); border-bottom: 1px solid var(--line);
  }
  .brand {
    font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: .01em;
    background: none; border: 0; padding: 4px 0; text-align: left; line-height: 1.2;
  }
  .toggle {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 6px 14px; font-size: .9rem; white-space: nowrap;
  }
  .toggle:hover { border-color: var(--lapis); }

  /* ---------- Estructura ---------- */
  .layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100vh - 60px); }
  .rail {
    border-right: 1px solid var(--line); background: var(--wall-2);
    padding: 22px 14px 40px 18px;
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px);
    align-self: start; max-height: calc(100vh - 56px); overflow-y: auto;
  }
  .rail h2 { font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 12px 6px; font-weight: 600; }
  .rail ol { list-style: none; margin: 0; padding: 0; position: relative; }
  .rail ol::before {
    content: ""; position: absolute; left: 17px; top: 14px; bottom: 14px; width: 2px; background: var(--line);
  }
  .rail li { position: relative; }
  .rail .item {
    display: grid; grid-template-columns: 36px 1fr; align-items: center; gap: 6px;
    width: 100%; text-align: left; background: none; border: 0; padding: 7px 8px 7px 0;
    border-radius: 8px; font-size: .95rem; line-height: 1.3; color: var(--ink-soft);
  }
  .rail .dot {
    width: 24px; height: 24px; margin-left: 6px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--wall-2); z-index: 1;
    display: grid; place-items: center; font-size: .72rem; font-weight: 600; color: var(--ink-soft);
  }
  .rail .item:hover { color: var(--ink); }
  .rail .item[aria-current="page"] { color: var(--ink); font-weight: 600; }
  .rail .item[aria-current="page"] .dot { background: var(--lapis); border-color: var(--lapis); color: var(--wall); }
  .rail .group { margin: 14px 0 4px 6px; font-size: .85rem; color: var(--ink-soft); font-weight: 500; }

  main { padding: clamp(20px, 4vw, 56px); outline: none; min-width: 0; }
  .view { max-width: 1040px; margin: 0 auto; animation: enter .45s ease both; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Portada ---------- */
  .cover { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
  .cover h1 {
    font-family: var(--font-display); font-weight: 600; margin: 0 0 22px;
    font-size: clamp(2.5rem, 6vw, 4.6rem); line-height: 1.02; letter-spacing: -.01em;
  }
  .cover .sub { color: var(--ink-soft); margin: 0 0 6px; }
  .plaque {
    border-left: 4px solid var(--brass); padding: 4px 0 4px 18px; margin: 28px 0;
  }
  .plaque p { margin: 2px 0; }
  .plaque .k { color: var(--ink-soft); font-size: .92rem; }
  .plaque .v { font-weight: 600; }
  .btn {
    display: inline-block; background: var(--lapis); color: var(--wall); border: 0;
    border-radius: 10px; padding: 13px 24px; font-weight: 600; letter-spacing: .01em;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--lapis); }
  .cover figure { margin: 0; }
  .frame {
    padding: 14px; background: linear-gradient(135deg, var(--frame-b), var(--frame-a) 55%, var(--frame-b));
    box-shadow: var(--shadow);
  }
  .mat { background: var(--mat); padding: clamp(10px, 2vw, 22px); }
  .cover svg { display: block; width: 100%; height: auto; }
  .cover__media img { display: block; width: 100%; height: auto; }
  .cover figcaption, .mat-caption { font-size: .92rem; color: var(--ink-soft); margin-top: 14px; font-style: italic; }

  /* ---------- Introducción ---------- */
  .page-head { margin-bottom: 30px; }
  .page-head h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2rem, 4.4vw, 3.2rem); line-height: 1.08; margin: 0 0 10px; }
  .page-head p { color: var(--ink-soft); margin: 0; max-width: 62ch; }
  .vertientes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .vert { padding: 28px 28px 32px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); position: relative; }
  .vert::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 5px; background: var(--c, var(--lapis)); }
  .vert:nth-child(1) { --c: #2d4a94; }
  .vert:nth-child(2) { --c: #8a6a24; }
  .vert:nth-child(3) { --c: #7b3d5e; }
  .vert:nth-child(4) { --c: #2a7d6e; }
  .vert h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.55rem; line-height: 1.15; margin: 8px 0 12px; }
  .vert p { margin: 0; color: var(--ink-soft); }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }

  /* ---------- Sala ---------- */
  .room-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 26px; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
  .room-head .n { color: var(--brass); font-weight: 600; font-size: .95rem; }
  .room-head h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.2rem, 5vw, 3.6rem); line-height: 1.05; margin: 0; flex-basis: 100%; }
  .room { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(24px, 4vw, 52px); align-items: start; }
  .artwork { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); }
  .canvas {
    min-height: 340px; display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: clamp(18px, 3vw, 30px);
    background:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.55), transparent 60%),
      linear-gradient(160deg, #e6dfcc, #cfc5a8);
    color: #2a2418;
  }
  .canvas .media { display: grid; gap: clamp(10px, 2vw, 16px); width: 100%; }
  .canvas .media--multi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .canvas .media-item { margin: 0; display: grid; gap: 8px; align-content: start; }
  .canvas .media-item img { display: block; width: 100%; height: auto; background: #fff; box-shadow: var(--shadow); }
  .canvas .src { font-size: .8rem; line-height: 1.45; color: #6b5a2c; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
  .canvas .src__txt { font-weight: 600; }
  .canvas .src__fuente a { color: #6b5a2c; text-decoration: underline; text-underline-offset: 2px; }
  .canvas .src__fuente a:hover { color: var(--lapis); }
  @media (max-width: 600px) { .canvas .media--multi { grid-template-columns: 1fr; } }
  .fields dl { margin: 0; }
  .field { padding: 0 0 22px; margin: 0 0 22px; border-bottom: 1px solid var(--line); }
  .field:last-child { border-bottom: 0; margin-bottom: 0; }
  .field dt { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--lapis); margin-bottom: 6px; }
  .field dd { margin: 0; }
  .field ul { margin: 0; padding-left: 1.2em; }
  .field li { margin: 0 0 10px; padding-left: 4px; }
  .field li::marker { color: var(--brass); }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pager .btn { display: inline-flex; flex-direction: column; text-align: left; line-height: 1.25; }
  .pager .btn small { font-weight: 500; opacity: .8; font-size: .8rem; }
  .pager .btn.next { text-align: right; }
  .pager .spacer { flex: 1; }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .rail {
      position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 15;
      max-height: none; padding: 8px 10px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden;
    }
    .rail h2, .rail .group { display: none; }
    .rail ol { display: flex; gap: 4px; width: max-content; }
    .rail ol::before { display: none; }
    .rail .item { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; white-space: nowrap; border: 1px solid transparent; border-radius: 999px; max-width: 220px; }
    .rail .item .t { overflow: hidden; text-overflow: ellipsis; }
    .rail .dot { margin-left: 0; flex: none; }
    .rail .item[aria-current="page"] { border-color: var(--lapis); }
    .cover, .room { grid-template-columns: 1fr; }
    .artwork { position: static; }
    .vertientes { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .view { animation: none; } }

  /* ---------- Salas por vertiente ---------- */
  .hall { margin: 26px 0 30px; border-top: 1px solid var(--line); }
  .hall button {
    display: grid; grid-template-columns: 40px 1fr; align-items: baseline; width: 100%; text-align: left;
    background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 4px;
    font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; line-height: 1.25;
  }
  .hall button span.n { color: var(--brass); font-family: var(--font-body); font-size: .95rem; }
  .hall button:hover { background: var(--lapis-soft); }
  .sala-head { border-left: 6px solid var(--c, var(--lapis)); padding-left: clamp(16px, 3vw, 28px); margin-bottom: 34px; }
  .sala-head .n { color: var(--brass); font-weight: 600; font-size: .95rem; }
  .sala-head h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(2.1rem, 4.8vw, 3.4rem); line-height: 1.06; margin: 4px 0 0; }
  .premisa { background: var(--panel); border: 1px solid var(--line); border-top: 5px solid var(--c, var(--lapis)); padding: clamp(20px, 3vw, 32px); margin-bottom: 40px; }
  .premisa h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; margin: 0 0 8px; color: var(--c, var(--lapis)); }
  .premisa p { margin: 0; max-width: 70ch; }
  .tl-title { font-family: var(--font-display); font-weight: 600; font-size: 1.5rem; margin: 0 0 6px; }
  .tl-note { color: var(--ink-soft); margin: 0 0 18px; font-size: .95rem; }
  .tl { list-style: none; margin: 0; padding: 0 0 0 26px; position: relative; }
  .tl::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
  .tl li { position: relative; margin: 0 0 14px; }
  .tl li::before {
    content: ""; position: absolute; left: -26px; top: 22px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--panel); border: 3px solid var(--c, var(--lapis));
  }
  .tl button {
    width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line);
    padding: 14px 18px; display: block;
  }
  .tl button:hover { border-color: var(--c, var(--lapis)); background: var(--lapis-soft); }
  .tl .tn { display: block; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.2; }
  .tl .td { display: block; color: var(--ink-soft); font-size: .95rem; margin-top: 2px; }
  .back { background: none; border: 0; color: var(--lapis); padding: 0; margin-bottom: 14px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .rail .item.sala { font-weight: 600; color: var(--ink); }
  .rail .item.sub .dot { width: 18px; height: 18px; margin-left: 9px; font-size: .66rem; }
  .rail .item.sub { font-size: .9rem; }

  @media (max-width: 900px) {
    .rail .item.sub .dot { margin-left: 0; }
    .rail .group { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="brand" type="button">Museo Virtual · Los pioneros de la psicología precientífica</button>
  <button class="toggle" id="theme" type="button" aria-label="Cambiar entre tema claro y oscuro">Tema</button>
</header>

<div class="layout">
  <nav class="rail" aria-label="Recorrido del museo">
    <h2>Salas del museo</h2>
    <ol id="railList"></ol>
  </nav>
  <main id="main" tabindex="-1" aria-live="polite"></main>
</div>

<script>

      imagenes: ["img/platon-detalle.jpg"],

      ilustracion: "Detalle de la obra La escuela de Atenas de Rafael Sanzio, donde Platón aparece señalando con el dedo índice hacia el cielo mientras sostiene su diálogo Timeo, simbolizando su concepción del mundo de las ideas y la primacía del alma inmaterial sobre el cuerpo terrenal."

    {

    {

    },
    {

      out += '<li><button type="button" class="item sala" data-go="' + stepIndex("sala", si) + '"><span class="dot" aria-hidden="true">' + (si + 1) + '</span><span class="t">Sala ' + (si + 1) + ': ' + esc(sa.titulo) + '</span></button></li>';
      sa.pabs.forEach(function (pi, k) {
        out += '<li><button type="button" class="item sub" data-go="' + stepIndex("pab", si, k) + '"><span class="dot" aria-hidden="true"></span><span class="t">' + esc(PABS[pi].titulo) + '</span></button></li>';
      });
    });
    railList.innerHTML = out;
  }

  function syncRail() {
    var btns = railList.querySelectorAll(".item");
    for (var k = 0; k < btns.length; k++) {
      if (Number(btns[k].getAttribute("data-go")) === current) {
        btns[k].setAttribute("aria-current", "page");
        if (window.matchMedia("(max-width: 900px)").matches) btns[k].scrollIntoView({ inline: "center", block: "nearest" });
      } else {
        btns[k].removeAttribute("aria-current");
      }
    }
  }

  /* ---------- Navegación ---------- */
  function go(i, opts) {
    if (isNaN(i) || i < 0 || i >= TOTAL) i = 0;
    current = i;
    var st = STEPS[i];
    main.innerHTML = st.type === "cover" ? viewCover() : st.type === "sala" ? viewSala(st.s) : viewPab(st.s, st.p);
    syncRail();
    document.title = stepName(i) + " | Los pioneros de la psicología precientífica";
    if (!opts || !opts.silent) {
      try { history.replaceState(null, "", "#" + i); } catch (e) { location.hash = "#" + i; }
      window.scrollTo(0, 0);
      var h = main.querySelector("[tabindex='-1']");
      if (h) h.focus({ preventScroll: true });
    }
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-go]");
    if (t) go(Number(t.getAttribute("data-go")));
  });
  document.getElementById("brand").addEventListener("click", function () { go(0); });
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    if (e.key === "ArrowRight" && current < TOTAL - 1) go(current + 1);
    if (e.key === "ArrowLeft" && current > 0) go(current - 1);
  });
  window.addEventListener("hashchange", function () {
    var n = parseInt(location.hash.replace("#", ""), 10);
    if (!isNaN(n) && n !== current) go(n);
  });

  /* ---------- Tema ---------- */
  var root = document.documentElement;
  var themeBtn = document.getElementById("theme");
  function isDark() {
    var t = root.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function paintTheme() { themeBtn.textContent = isDark() ? "Tema claro" : "Tema oscuro"; }
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("museo-theme", next); } catch (e) {}
    paintTheme();
  });
  try {
    var saved = localStorage.getItem("museo-theme");
    if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  } catch (e) {}
  paintTheme();

  buildRail();
  var start = parseInt(location.hash.replace("#", ""), 10);
  go(isNaN(start) ? 0 : start, { silent: true });
})();
</script>
</body>
</html>
